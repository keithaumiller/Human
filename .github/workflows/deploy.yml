name: Deploy Human Success Module
on:
  push:
    branches: [ master ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Verify deployment secrets
      run: |
        echo "Checking required secrets..."
        if [ -z "${{ secrets.HOST }}" ]; then
          echo "❌ ERROR: HOST secret is not configured"
          exit 1
        fi
        if [ -z "${{ secrets.USERNAME }}" ]; then
          echo "❌ ERROR: USERNAME secret is not configured"  
          exit 1
        fi
        if [ -z "${{ secrets.PRIVATE_KEY }}" ]; then
          echo "❌ ERROR: PRIVATE_KEY secret is not configured"
          exit 1
        fi
        if [ -z "${{ secrets.HUBGIT_PAT }}" ]; then
          echo "❌ ERROR: HUBGIT_PAT secret is not configured"
          exit 1
        fi
        echo "✅ All required secrets are configured"
    
    - name: Deploy Human Success module to production
      uses: appleboy/ssh-action@v1.0.0
      env:
        HUBGIT_PAT: ${{ secrets.HUBGIT_PAT }}
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.PRIVATE_KEY }}
        envs: HUBGIT_PAT
        script: |
          set -e  # Exit on any error
          
          echo "=== Starting Human Success Module Deployment ==="
          echo "Deployment started at: $(date)"
          
          # Create a temporary directory for the repository
          TEMP_DIR="/tmp/human_success_deploy_$(date +%s)"
          mkdir -p $TEMP_DIR
          cd $TEMP_DIR
          
          echo "=== Cloning repository to temporary location ==="
          if ! git clone https://${HUBGIT_PAT}@github.com/keithaumiller/Human.git .; then
            echo "ERROR: Failed to clone repository"
            exit 1
          fi
          
          echo "=== Repository cloned successfully ==="
          ls -la
          
          # Verify humansuccess module files exist in temp directory
          echo "=== Verifying Human Success module files ==="
          if [ -d "Codebase/Drupalmodules/humansuccess" ]; then
            echo "✓ Human Success module directory found"
            ls -la Codebase/Drupalmodules/humansuccess/
          else
            echo "ERROR: Human Success module directory not found!"
            exit 1
          fi
          
          # Copy ONLY the humansuccess module to the Drupal modules directory
          echo "=== Deploying Human Success module (preserving other modules) ==="
          sudo mkdir -p /var/www/html/drupal/modules/custom/humansuccess
          
          # Remove old version if exists, then copy new version
          sudo rm -rf /var/www/html/drupal/modules/custom/humansuccess/*
          sudo cp -r Codebase/Drupalmodules/humansuccess/* /var/www/html/drupal/modules/custom/humansuccess/
          
          echo "✓ Module files copied successfully (other modules preserved)"
          
          # Verify module files were copied correctly
          echo "=== Verifying deployed module files ==="
          ls -la /var/www/html/drupal/modules/custom/humansuccess/
          
          if [ -f "/var/www/html/drupal/modules/custom/humansuccess/humansuccess.info.yml" ]; then
            echo "✓ Module info file exists"
            cat /var/www/html/drupal/modules/custom/humansuccess/humansuccess.info.yml
          else
            echo "ERROR: Module info file missing!"
            exit 1
          fi
          
          # Verify other custom modules are still present
          echo "=== Verifying other custom modules are preserved ==="
          ls -la /var/www/html/drupal/modules/custom/
          
          # Clean up temporary directory
          cd /
          rm -rf $TEMP_DIR
          echo "✓ Temporary files cleaned up"

          # Set proper permissions ONLY for the humansuccess module
          sudo chown -R www-data:www-data /var/www/html/drupal/modules/custom/humansuccess
          sudo find /var/www/html/drupal/modules/custom/humansuccess -type f -exec chmod 644 {} \;
          sudo find /var/www/html/drupal/modules/custom/humansuccess -type d -exec chmod 755 {} \;
          
          echo "✓ Permissions set correctly for Human Success module only"

          echo "=== Human Success module deployed successfully (other modules preserved) ==="

    - name: Enable and configure Human Success module
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.PRIVATE_KEY }}
        script: |
          set -e

          echo "=== Enabling Human Success module ==="

          cd /var/www/html/drupal

          # Clear cache first to refresh module discovery
          echo "Clearing cache before enabling module..."
          sudo -u www-data drush cr

          # Check if humansuccess module exists and can be enabled
          echo "=== Checking module status ==="
          if sudo -u www-data drush pm:list --type=module | grep -q "humansuccess"; then
            echo "✓ Human Success module found in system"
          else
            echo "ERROR: Human Success module not found in Drupal system"
            echo "Available custom modules:"
            sudo -u www-data drush pm:list --type=module | grep -i custom || echo "No custom modules found"
            exit 1
          fi

          # Check if module is already enabled
          if sudo -u www-data drush pm:list --type=module --status=enabled | grep -q "humansuccess"; then
            echo "✓ Human Success module is already enabled"
          else
            echo "Enabling Human Success module..."
            # Try to enable with more verbose output
            if sudo -u www-data drush en humansuccess -y --verbose; then
              echo "✓ Human Success module enabled successfully"
            else
              echo "ERROR: Failed to enable Human Success module"
              echo "Checking for dependency issues..."
              sudo -u www-data drush pm:list --type=module | grep humansuccess || echo "Module not found"
              echo "Drupal status:"
              sudo -u www-data drush status
              exit 1
            fi
          fi

          # Import configuration if needed (but don't fail if no config)
          echo "=== Checking for configuration updates ==="
          sudo -u www-data drush config:status || echo "No configuration changes detected"

          echo "=== Module enablement completed ==="

    - name: Clear Drupal cache and verify deployment
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.PRIVATE_KEY }}
        script: |
          set -e

          echo "=== Clearing Drupal cache ==="

          cd /var/www/html/drupal

          # Fix file permissions for Drupal files directory
          sudo chown -R www-data:www-data /var/www/html/drupal/sites/default/files
          sudo find /var/www/html/drupal/sites/default/files -type f -exec chmod 664 {} \;
          sudo find /var/www/html/drupal/sites/default/files -type d -exec chmod 775 {} \;

          # Clear Drupal cache as www-data user
          if ! sudo -u www-data drush cr; then
            echo "ERROR: Failed to clear Drupal cache"
            exit 1
          fi

          echo "✓ Cache cleared successfully"

          # Verify module deployment
          echo "=== Verifying Human Success module deployment ==="
          
          # Check if module files exist
          if [ -f "/var/www/html/drupal/modules/custom/humansuccess/humansuccess.info.yml" ]; then
            echo "✓ Module files are present"
          else
            echo "ERROR: Module files not found!"
            exit 1
          fi
          
          # Check if module is enabled
          if sudo -u www-data drush pm:list --type=module --status=enabled | grep -q "humansuccess"; then
            echo "✓ Human Success module is enabled"
          else
            echo "ERROR: Human Success module is not enabled!"
            exit 1
          fi
          
          # Check if routes are accessible
          echo "=== Testing module routes ==="
          if sudo -u www-data drush route:list | grep -q "humansuccess"; then
            echo "✓ Module routes are registered"
          else
            echo "WARNING: Module routes not found, but this may be normal"
          fi
          
          # Test basic connectivity (optional - requires curl)
          echo "=== Testing web accessibility ==="
          if command -v curl >/dev/null 2>&1; then
            if curl -s -o /dev/null -w "%{http_code}" http://localhost/human-success | grep -q "200\|301\|302"; then
              echo "✓ Human Success dashboard is accessible"
            else
              echo "WARNING: Dashboard may not be accessible yet (this could be normal if authentication is required)"
            fi
          else
            echo "ℹ Curl not available, skipping web accessibility test"
          fi

          echo "=== Deployment verification completed ==="
          echo "Deployment finished at: $(date)"
          echo ""
          echo "🎉 Human Success module deployment successful!"
          echo ""
          echo "Access URLs:"
          echo "- Dashboard: https://thetruthperspective.org/human-success"
          echo "- Metrics: https://thetruthperspective.org/human-success/metrics"
          echo "- Admin: https://thetruthperspective.org/admin/human-success"